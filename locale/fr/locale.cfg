[mod-name]
continuous-pole-placement=Placement continu de poteaux

[mod-description]
continuous-pole-placement=Couverture électrique continue lors du placement de poteaux en déplacement. Activation individuelle. Prend en compte les prototypes et la qualité.

[controls]
cpp-toggle=Basculer le placement à couverture électrique continue

[shortcut-name]
cpp-toggle=Couverture continue des poteaux

[shortcut-description]
cpp-toggle=Active la couverture électrique continue lors du placement de poteaux en déplacement. Bouton surligné = ACTIVÉ. Respecte la couverture et la portée du câble. Cliquer à nouveau rétablit le placement vanilla.

[cpp]
enabled=Couverture continue des poteaux : ACTIVÉE
disabled=Couverture continue des poteaux : DÉSACTIVÉE
unsupported=Couverture continue indisponible pour ce poteau ; placement vanilla conservé.
blocked=Couverture continue interrompue : aucun emplacement libre et accessible sur ce segment.
connection-blocked=Couverture continue : connexion cuivre empêchée par les règles du poteau.
