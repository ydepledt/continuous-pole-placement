[mod-name]
continuous-pole-placement=Continuous Pole Placement

[mod-description]
continuous-pole-placement=Continuous electric coverage when dragging poles. Toggle independently for each player. Reads pole prototypes and item quality.

[controls]
cpp-toggle=Toggle continuous electric coverage placement

[shortcut-name]
cpp-toggle=Continuous pole coverage

[shortcut-description]
cpp-toggle=Toggle continuous electric coverage while dragging poles. Highlighted = ON. Uses each pole's coverage and wire reach. Click again to restore vanilla placement.

[cpp]
enabled=Continuous pole coverage: ON
disabled=Continuous pole coverage: OFF
unsupported=Continuous coverage is unavailable for this pole; using vanilla placement.
blocked=Continuous coverage interrupted: no reachable, clear placement on this segment.
connection-blocked=Continuous coverage: copper connection blocked by the pole's connection rules.
